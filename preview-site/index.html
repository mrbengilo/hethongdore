<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DORE Preview Branch</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#f5f8f6;color:#16231b}button,input,select{font:inherit}button{cursor:pointer}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:700}.g{background:#087d3b;color:#fff}.w{background:#fff;border:1px solid #dce6df}.r{background:#c83d3d;color:#fff}input,select{width:100%;padding:9px;border:1px solid #ccd8d0;border-radius:8px}label{display:grid;gap:5px;font-size:12px;font-weight:700}.login{min-height:100vh;display:grid;place-content:center}.box,.panel,.stat{background:#fff;border:1px solid #dfe8e2;border-radius:12px;padding:17px;box-shadow:0 6px 20px #1232}.box{width:min(430px,90vw);padding:30px}.logo{width:100px;height:100px;border-radius:22px;background:#7fd12c;color:#0754d8;margin:auto;display:grid;place-items:center;font-size:27px;font-weight:900}.box h2{text-align:center;color:#087d3b}.grid{display:grid;gap:10px}.two{grid-template-columns:1fr 1fr}.shell{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{position:fixed;inset:0 auto 0 0;width:245px;background:linear-gradient(#075139,#043a2c);color:#fff;padding:16px 12px;display:flex;flex-direction:column}.brand{font-size:22px;font-weight:900;color:#efc85e;padding:10px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#fff;text-align:left;padding:11px;border-radius:8px;font-weight:700}.nav .on,.nav button:hover{background:#43b97744}.bottom{margin-top:auto}.main{grid-column:2}.head{background:#fff;border-bottom:1px solid #dfe8e2;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}.head h1{margin:0;font-size:22px}.content{padding:20px 24px 40px}.stack{display:grid;gap:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat small{color:#68746d}.stat b{display:block;color:#087d3b;font-size:20px;margin-top:8px}.phead{display:flex;justify-content:space-between;align-items:center;gap:8px}.phead h2{margin:0 0 12px}.stores{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.store{background:#fff;border:1px solid #dfe8e2;border-radius:10px;padding:14px;text-align:left}.store h3{margin:6px 0}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;align-items:end}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:9px;border-bottom:1px solid #edf1ee;text-align:left;font-size:11px}.table th{background:#f8faf9;color:#66736b}.note{padding:11px;border-radius:8px;background:#eef6ff;color:#285071}.warn{background:#fff4e7;color:#7c4b18}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.step{border:1px solid #dfe8e2;border-radius:9px;padding:12px}.done{background:#eff9f2}.branch{position:fixed;right:10px;bottom:10px;background:#14251c;color:#fff;padding:7px 10px;border-radius:7px;font-size:10px}.mut{color:#69766e}.menu{display:none}@media(max-width:850px){.shell{display:block}.side{display:none}.main{grid-column:auto}.menu{display:block}.stats,.form,.steps,.stores,.two{grid-template-columns:1fr 1fr}.content{padding:14px}}@media(max-width:520px){.stats,.form,.steps,.stores,.two{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column;gap:8px}}
</style></head><body><div id="app"></div><div class="branch">preview/full-website-20260808 · KHÔNG PHẢI MAIN</div><script>
const K='dore_simple_preview',M=n=>Math.round(+n||0).toLocaleString('en-US')+' đồng',D=x=>new Date(x).toLocaleString('vi-VN',{hour12:false}),ID=p=>p+Date.now()+Math.random().toString(16).slice(2,6);let u=null,v='overview',sid='s1';let d=JSON.parse(localStorage.getItem(K)||'null')||{stores:[['s1','DORE THỐT NỐT'],['s2','DORE CẦN THƠ'],['s3','DORE LONG XUYÊN'],['s4','DORE VĨNH LONG'],['s5','DORE SÓC TRĂNG']].map(x=>({id:x[0],name:x[1]})),costs:[],stock:[],emps:[{id:'e1',store:'s1',code:'NV001',name:'Nguyễn Thị An',phone:'0765109784',rate:20000}],orders:[],shifts:[],pay:{},div:[],active:null};const save=()=>localStorage.setItem(K,JSON.stringify(d)),S=()=>d.stores.find(x=>x.id===sid),E=()=>d.emps[0],fin=s=>{let r=d.orders.filter(x=>x.store===s).reduce((a,x)=>a+x.amount,0),c=d.costs.filter(x=>x.store===s).reduce((a,x)=>a+x.amount,0),i=d.stock.filter(x=>x.store===s).reduce((a,x)=>a+x.total,0),h=d.shifts.filter(x=>x.store===s).reduce((a,x)=>a+(new Date(x.end||Date.now())-new Date(x.start))/36e5,0),sal=h*20000,e=c+i+sal+3000000,p=r-e,rate=h&&p/h>=30000?.07:h&&p/h>=15000?.05:h&&p/h>=7000?.03:0;return{r,e,p,h,sal,kpi:Math.max(0,p*rate),mgr:Math.max(0,p*.02)}};
const st=(a,b)=>`<div class="stat"><small>${a}</small><b>${b}</b></div>`,tb=(h,r)=>`<div class="table"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(y=>`<tr>${y.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}">Chưa có dữ liệu</td></tr>`}</table></div>`,pn=(t,b)=>`<section class="panel"><div class="phead"><h2>${t}</h2></div>${b}</section>`;
function login(){return`<main class="login"><form class="box" id="login"><div class="logo">DORE</div><h2>Bản chạy thử toàn bộ website</h2><p class="mut">Dữ liệu lưu cục bộ, không ảnh hưởng production.</p><label>Tên đăng nhập<input name="name" value="admin"></label><label>Mật khẩu<input name="pass" type="password" value="dore2026"></label><button class="btn g" style="width:100%;margin-top:12px">Đăng nhập</button><div class="grid two" style="margin-top:9px"><button type="button" class="btn w" data-role="manager">Quản lý</button><button type="button" class="btn w" data-role="employee">Nhân viên</button></div></form></main>`}
const menus={manager:[['overview','Tổng quan'],['costs','Chi phí'],['inventory','Nhập hàng'],['employees','Nhân viên'],['shifts','Ca làm việc'],['orders','Đơn hàng'],['payroll','Lương thưởng'],['reports','Báo cáo'],['dividends','Cổ tức']],employee:[['home','Trang chủ'],['orders','Đơn hàng'],['payroll','Bảng lương'],['history','Lịch sử ca']]};
function shell(body){let ms=menus[u],title=ms.find(x=>x[0]===v)?.[1]||'DORE';return`<div class="shell"><aside class="side"><div class="brand">DORE<br><small>${u==='manager'?'QUẢN LÝ':'NHÂN VIÊN'}</small></div><nav class="nav">${ms.map(x=>`<button data-view="${x[0]}" class="${v===x[0]?'on':''}">${x[1]}</button>`).join('')}</nav><div class="bottom"><p>${u==='manager'?'Quản trị viên':'NV001 · Nguyễn Thị An'}</p><button class="btn w" data-out style="width:100%">Đăng xuất</button></div></aside><main class="main"><header class="head"><h1>${title}${u==='manager'?' · '+S().name:''}</h1><div>${new Date().toLocaleString('vi-VN',{hour12:false})}</div></header><div class="content">${body}</div></main></div>`}
function manager(){let f=fin(sid),b='';if(v==='overview')b=`<div class="stack"><div class="stats">${st('Doanh thu',M(f.r))}${st('Tổng chi phí',M(f.e))}${st('Lợi nhuận',M(f.p))}${st('KPI quản lý 2%',M(f.mgr))}</div>${pn('Cửa hàng',`<div class="stores">${d.stores.map(s=>{let z=fin(s.id);return`<button class="store" data-store="${s.id}"><h3>${s.name}</h3><span>Doanh thu: ${M(z.r)}</span><br><span>Lợi nhuận: ${M(z.p)}</span></button>`}).join('')}</div>`)}</div>`;
if(v==='costs')b=`<div class="stack">${pn('Tạo chi phí cố định / phát sinh',`<form id="cost" class="form"><label>Loại<select name="type"><option>Cố định</option><option>Phát sinh</option></select></label><label>Danh mục<select name="cat"><option>Set up</option><option>Điện</option><option>Nước</option><option>Wifi</option><option>Rác</option><option>Marketing</option><option>Khác</option></select></label><label>Số tiền<input name="amount" type="number" required></label><button class="btn g">LƯU</button></form>`)}${pn('Lịch sử cập nhật',tb(['Loại','Danh mục','Số tiền','Ngày giờ'],d.costs.filter(x=>x.store===sid).map(x=>[x.type,x.cat,M(x.amount),D(x.at)])))}</div>`;
if(v==='inventory')b=`<div class="stack">${pn('Nhập hàng',`<form id="stock" class="form"><label>Tên hàng<input name="name" required></label><label>Số bao<input name="qty" type="number" required></label><label>Kg<input name="kg" type="number" required></label><label>Đơn giá/kg<input name="price" type="number" required></label><label>Vận chuyển<input name="ship" type="number" value="0"></label><button class="btn g">LƯU PHIẾU</button></form><p class="note">Lưu xong biểu mẫu tự đặt lại để nhập phiếu tiếp theo.</p>`)}${pn('Lịch sử nhập',tb(['Hàng','Bao','Kg','Đơn giá','Vận chuyển','Thành tiền'],d.stock.filter(x=>x.store===sid).map(x=>[x.name,x.qty,x.kg,M(x.price),M(x.ship),M(x.total)])))}</div>`;
if(v==='employees')b=`<div class="stack">${pn('Thêm nhân viên',`<form id="emp" class="form"><label>Mã NV<input name="code" required></label><label>Tên<input name="name" required></label><label>SĐT<input name="phone" required></label><label>Địa chỉ<input name="address" required></label><label>Tuổi<input name="age" type="number" required></label><button class="btn g">LƯU</button></form>`)}${pn('Danh sách nhân viên',tb(['Mã','Tên','SĐT','Địa chỉ','Tuổi'],d.emps.filter(x=>x.store===sid).map(x=>[x.code,x.name,x.phone,x.address||'—',x.age||'—'])))}</div>`;
if(v==='shifts')b=`<div class="stack"><p class="note warn">Quá 60 phút sau giờ kết ca: tự đóng ca cũ, mở ca mới tại cùng mốc; lịch sử vẫn là 2 ca riêng.</p>${pn('Lịch sử ca',tb(['Mã ca','Nhân viên','Vào','Kết','Trạng thái'],d.shifts.filter(x=>x.store===sid).map(x=>[x.code,E().name,D(x.start),x.end?D(x.end):'Đang làm',x.auto?'Tự động chuyển':x.status])))}<button class="btn g" data-sim>MÔ PHỎNG CHUYỂN CA</button></div>`;
if(v==='orders')b=`<div class="stack">${pn('Đơn hàng',tb(['Mã','Nhân viên','Giá trị','Ca','Thời gian'],d.orders.filter(x=>x.store===sid).map(x=>[x.code,E().name,M(x.amount),x.shift||'—',D(x.at)])))}</div>`;
if(v==='payroll'){let p=d.pay[sid]||{};b=`<div class="stack"><div class="stats">${st('Tổng giờ',f.h.toFixed(2))}${st('Lương nhân viên',M(f.sal))}${st('KPI nhân viên',M(f.kpi))}${st('Lợi nhuận',M(f.p))}</div>${pn('Xác nhận chi và khóa kỳ',`<div class="steps">${['salary','bonus','paid','locked'].map((x,i)=>`<div class="step ${p[x]?'done':''}"><b>${i+1}. ${['Chi lương','Thưởng & phụ cấp','Đã chi','Khóa kỳ'][i]}</b><p>${p[x]?D(p[x]):'Chưa xác nhận'}</p><button class="btn ${x==='locked'?'r':'w'}" data-pay="${x}" ${p[x]?'disabled':''}>XÁC NHẬN</button></div>`).join('')}</div>`)}</div>`}
if(v==='reports')b=`<div class="stack"><div class="stats">${st('Doanh thu',M(f.r))}${st('Chi phí',M(f.e))}${st('Lợi nhuận',M(f.p))}${st('Đánh giá',f.p>0?'Hiệu quả tốt':'Cần cải thiện')}</div><p class="note">So sánh kỳ trước: doanh thu và lợi nhuận được đánh giá từ dữ liệu đơn hàng, chi phí, nhập hàng và lương thực tế của cửa hàng.</p></div>`;
if(v==='dividends'){let t=d.stores.reduce((a,s)=>a+Math.max(0,fin(s.id).p-fin(s.id).kpi-fin(s.id).mgr),0);b=`<div class="stack"><div class="stats">${st('Có thể chia',M(t))}${st('Cổ đông A 60%',M(t*.6))}${st('Cổ đông B 40%',M(t*.4))}${st('Lịch sử',d.div.length)}</div><button class="btn g" data-div>CHỐT CHIA CỔ TỨC</button>${pn('Lịch sử chia',tb(['Kỳ','Tổng','60%','40%','Thời gian'],d.div.map(x=>[x.period,M(x.total),M(x.a),M(x.b),D(x.at)])))}</div>`}return shell(b)}
function employee(){let a=d.active,b='';if(v==='home')b=`<div class="stack"><div class="stats">${st('Nhân viên',E().name)}${st('Ca hiện tại',a?a.name:'Chưa vào ca')}${st('Thời gian bắt đầu',a?D(a.start):'—')}${st('Trạng thái',a?'Đang làm':'Chưa điểm danh')}</div><button class="btn ${a?'r':'g'}" data-shift>${a?'KẾT CA':'ĐIỂM DANH VÀO CA'}</button>${a?'<button class="btn w" data-roll>MÔ PHỎNG QUÁ 60 PHÚT</button>':''}<p class="note warn">Tự chuyển ca vẫn ghi thời gian liên tục nhưng lịch sử tách thành 2 ca riêng.</p></div>`;
if(v==='orders')b=`<div class="stack">${a?pn('Thêm đơn hàng',`<form id="order" class="form"><label>Giá trị<input name="amount" type="number" required></label><label>Thanh toán<select name="pay"><option>Tiền mặt</option><option>Chuyển khoản</option></select></label><button class="btn g">LƯU ĐƠN</button></form>`):'<p class="note warn">Cần điểm danh trước khi tạo đơn.</p>'}${pn('Đơn hàng của tôi',tb(['Mã','Giá trị','Ca','Thời gian'],d.orders.filter(x=>x.emp==='e1').map(x=>[x.code,M(x.amount),x.shift,D(x.at)])))}</div>`;
if(v==='payroll'){let f=fin('s1');b=`<div class="stats">${st('Giờ làm',f.h.toFixed(2))}${st('Lương',M(f.sal))}${st('KPI dự tính',M(f.kpi))}${st('Tổng nhận',M(f.sal+f.kpi))}</div>`}if(v==='history')b=pn('Lịch sử ca riêng biệt',tb(['Mã','Ca','Vào','Kết','Trạng thái'],d.shifts.filter(x=>x.emp==='e1').map(x=>[x.code,x.name,D(x.start),x.end?D(x.end):'Đang làm',x.auto?'Tự động chuyển':x.status])));return shell(b)}
function render(){document.getElementById('app').innerHTML=!u?login():u==='manager'?manager():employee()}function start(){let x={code:'CA1-'+Date.now(),name:'Ca 1',start:new Date().toISOString(),store:'s1',emp:'e1',end:null,status:'ACTIVE'};d.active=x;d.shifts.push(x);save();render()}function end(){let x=d.shifts.find(x=>x.code===d.active?.code);if(x)x.end=new Date().toISOString(),x.status='COMPLETED';d.active=null;save();render()}function roll(){if(!d.active)return;let x=d.shifts.find(x=>x.code===d.active.code),t=new Date().toISOString();x.end=t;x.status='AUTO_COMPLETED';x.auto=true;let n={code:'CA2-AUTO-'+Date.now(),name:'Ca 2',start:t,store:'s1',emp:'e1',end:null,status:'ACTIVE',auto:true};d.shifts.push(n);d.active=n;save();render()}
document.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);if(e.target.id==='login'){if(f.get('pass')!=='dore2026')return alert('Sai mật khẩu');u=f.get('name')==='admin'?'manager':'employee';v=u==='manager'?'overview':'home'}if(e.target.id==='cost')d.costs.push({id:ID('c'),store:sid,type:f.get('type'),cat:f.get('cat'),amount:+f.get('amount'),at:new Date().toISOString()});if(e.target.id==='stock'){let kg=+f.get('kg'),price=+f.get('price'),ship=+f.get('ship');d.stock.push({id:ID('i'),store:sid,name:f.get('name'),qty:+f.get('qty'),kg,price,ship,total:kg*price+ship})}if(e.target.id==='emp')d.emps.push({id:ID('e'),store:sid,code:f.get('code'),name:f.get('name'),phone:f.get('phone'),address:f.get('address'),age:f.get('age'),rate:20000});if(e.target.id==='order')d.orders.push({id:ID('o'),store:'s1',emp:'e1',code:'DH'+Date.now().toString().slice(-6),amount:+f.get('amount'),shift:d.active.code,at:new Date().toISOString()});save();render()});
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.role){u=t.dataset.role;v=u==='manager'?'overview':'home';render()}if(t.dataset.out!==undefined){u=null;render()}if(t.dataset.view){v=t.dataset.view;render()}if(t.dataset.store){sid=t.dataset.store;render()}if(t.dataset.shift!==undefined)d.active?end():start();if(t.dataset.roll!==undefined)roll();if(t.dataset.sim!==undefined){if(!d.active)start();roll();v='shifts';u='manager';render()}if(t.dataset.pay){let p=d.pay[sid]||{};if(t.dataset.pay==='paid'&&(!p.salary||!p.bonus))return alert('Xác nhận lương và thưởng trước');if(t.dataset.pay==='locked'&&!p.paid)return alert('Ghi nhận đã chi trước');p[t.dataset.pay]=new Date().toISOString();d.pay[sid]=p;save();render()}if(t.dataset.div!==undefined){let t0=d.stores.reduce((a,s)=>a+Math.max(0,fin(s.id).p-fin(s.id).kpi-fin(s.id).mgr),0);d.div.unshift({period:new Date().toISOString().slice(0,7),total:t0,a:t0*.6,b:t0*.4,at:new Date().toISOString()});save();render()}});render();
</script></body></html>
