# DORE production SSH policy. The 00 prefix makes these values take
# precedence over cloud-init defaults because OpenSSH keeps the first value.
# Install only after the deploy public key and provider console recovery work.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
