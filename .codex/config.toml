# DORE project-scoped Codex defaults.
# Codex applies this file only when the repository is trusted.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
service_tier = "fast"
personality = "pragmatic"

[features]
fast_mode = true
multi_agent = true
shell_snapshot = true

[agents]
enabled = true
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "high"
